<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Icon Forge</title>
<style>
  * { box-sizing: border-box; }
  :root {
    color-scheme: light;
    --bg: #ece0c7;
    --panel: #fbf3e2;
    --panel-2: #f4e9d3;
    --ink: #33261a;
    --muted: #6d5941;
    --faint: #96805f;
    --border: #d8c5a2;
    --border-strong: #b99c70;
    --gold: #9a6a24;
    --gold-strong: #7a4f12;
    --danger: #a53a2c;
    --ok: #3f6b41;
    --shadow: 0 14px 30px rgba(74, 52, 26, 0.12);
  }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background-color: var(--bg);
    background-image:
      radial-gradient(1100px 700px at 8% -15%, rgba(255,253,245,.9), transparent 62%),
      repeating-linear-gradient(0deg, rgba(120,88,45,.035) 0 1px, transparent 1px 30px);
  }
  .app { max-width: 1500px; margin: 0 auto; padding: 28px 32px 60px; }
  header.top {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 20px;
    margin-bottom: 24px;
  }
  h1 { margin: 0; font-size: 34px; font-weight: 500; letter-spacing: .01em; }
  .sub { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
  .key-pill {
    display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px;
    border-radius: 999px; border: 1px solid var(--border); background: var(--panel);
    font-size: 12px; white-space: nowrap;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .dot--bad { background: var(--danger); }
  .layout { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 22px; align-items: start; }
  .side { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 20px; }
  .panel {
    padding: 18px; border: 1px solid var(--border); border-radius: 16px;
    background: var(--panel); box-shadow: var(--shadow);
  }
  .panel h2 { margin: 0 0 14px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .field:last-child { margin-bottom: 0; }
  label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
  input[type="text"] {
    width: 100%; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--border);
    background: #fffaf0; color: var(--ink); font: inherit; font-size: 14px; outline: none;
  }
  input[type="text"]:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(154,106,36,.12); }
  textarea {
    width: 100%; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--border);
    background: #fffaf0; color: var(--ink); font: inherit; font-size: 13px; line-height: 1.45;
    outline: none; resize: vertical; min-height: 62px;
  }
  textarea:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(154,106,36,.12); }
  .brief { border-top: 1px dashed var(--border); padding-top: 10px; margin-top: 2px; }
  .brief summary {
    cursor: pointer; font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--faint);
  }
  .brief[open] summary { color: var(--gold-strong); }
  .brief__body { display: flex; flex-direction: column; gap: 8px; padding-top: 10px; }
  .brief__body .field { margin-bottom: 0; }
  .brief__meta { font-size: 10.5px; color: var(--faint); line-height: 1.45; }
  .brief__row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); text-transform: none; letter-spacing: 0; }
  .check input { width: 16px; height: 16px; accent-color: var(--gold); }
  button {
    font: inherit; cursor: pointer; border-radius: 9px; border: 1px solid var(--border-strong);
    background: var(--panel-2); color: var(--ink); padding: 9px 13px;
    transition: background .15s ease, border-color .15s ease, color .15s ease, opacity .15s ease;
  }
  button:hover:not(:disabled) { border-color: var(--gold); background: #f7ecd6; }
  button.primary { background: linear-gradient(160deg, #e8c97f, #c99a43); border-color: #b98f3f; color: #241a0a; font-weight: 600; }
  button.primary:hover:not(:disabled) { filter: brightness(1.04); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.small { padding: 5px 9px; font-size: 11px; border-radius: 7px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .log {
    min-height: 90px; max-height: 220px; overflow: auto; white-space: pre-wrap;
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 11.5px;
    line-height: 1.5; color: var(--muted); background: #f6ecd8; border: 1px solid var(--border);
    border-radius: 9px; padding: 10px; margin: 0;
  }
  .banner { padding: 11px 14px; border-radius: 10px; border: 1px solid rgba(165,58,44,.3); background: rgba(165,58,44,.07); color: var(--danger); font-size: 12.5px; line-height: 1.5; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .icon-card {
    display: flex; flex-direction: column; gap: 12px; padding: 16px;
    border: 1px solid var(--border); border-radius: 16px; background: var(--panel);
    box-shadow: var(--shadow); min-width: 0;
  }
  .icon-card__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
  .icon-card__name { margin: 0; font-size: 16px; font-weight: 600; }
  .icon-card__id { margin-top: 2px; font-family: ui-monospace, Consolas, monospace; font-size: 10.5px; color: var(--faint); }
  .status { flex: none; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; padding: 4px 8px; border-radius: 999px; border: 1px solid; }
  .status--ok { color: var(--ok); border-color: rgba(63,107,65,.35); background: rgba(63,107,65,.08); }
  .status--bad { color: var(--danger); border-color: rgba(165,58,44,.3); background: rgba(165,58,44,.07); }
  .tokens { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .token {
    display: grid; place-items: center; width: 76px; height: 76px; flex: none;
    border-radius: 50%; border: 1px solid rgba(122,86,44,.45);
    background: radial-gradient(circle at 35% 28%, rgba(255,255,255,.35), transparent 42%), linear-gradient(160deg, #fdf6e6, #e8d8b8);
    color: var(--gold-strong); box-shadow: 0 9px 20px rgba(74,52,26,.16);
  }
  .token--dark {
    border-color: rgba(216,178,92,.55); color: #d8b25c;
    background: radial-gradient(circle at 35% 28%, rgba(255,255,255,.12), transparent 42%), linear-gradient(160deg, #2a2338, #1d1828);
    box-shadow: 0 9px 22px rgba(0,0,0,.4);
  }
  .token svg { width: 42px; height: 42px; display: block; }
  .sizes { display: flex; align-items: flex-end; gap: 14px; color: var(--gold-strong); }
  .size { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 9px; color: var(--faint); }
  .size svg { display: block; }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag { font-size: 10.5px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 2px 7px; }
  .problems { margin: 0; padding-left: 16px; color: var(--danger); font-size: 11.5px; line-height: 1.5; }
  .empty-icon { color: var(--faint); font-size: 11px; text-align: center; padding: 20px 8px; }
  .preview-panel { margin-top: 20px; }
  .preview-wrap {
    padding: 12px; border-radius: 12px; border: 1px dashed var(--border-strong);
    color: var(--faint); font-size: 12px; text-align: center;
    max-height: 72vh; overflow: auto;
  }
  .preview-wrap a { display: block; }
  .preview-wrap img { display: block; width: 100%; height: auto; border-radius: 8px; }
  .actions-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
  a.download { color: var(--gold-strong); font-size: 11px; align-self: center; }
  @media (max-width: 900px) {
    .app { padding: 20px 16px 40px; }
    .layout { grid-template-columns: 1fr; }
    .side { position: static; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1>Icon Forge</h1>
      <p class="sub">Генерация SVG-иконок для мест на карте D&amp;D</p>
    </div>
    <div class="key-pill">
      <span id="key-dot" class="dot dot--bad"></span>
      <span id="key-text">Проверяем ключ…</span>
      <button id="refresh" class="small" type="button">Обновить</button>
    </div>
  </header>

  <div id="banner"></div>

  <div class="layout">
    <aside class="side">
      <section class="panel">
        <h2>Новая иконка</h2>
        <form id="form">
          <div class="field">
            <label for="id">ID</label>
            <input id="id" name="id" type="text" placeholder="swamp" autocomplete="off" required>
          </div>
          <div class="field">
            <label for="title">Название</label>
            <input id="title" name="title" type="text" placeholder="Болото" autocomplete="off" required>
          </div>
          <div class="field">
            <label for="tags">Теги</label>
            <input id="tags" name="tags" type="text" placeholder="swamp, marsh" autocomplete="off">
          </div>
          <div class="field">
            <label for="brief">Уточнение</label>
            <textarea id="brief" name="brief" rows="3" placeholder="Что именно изобразить? Например: здание таверны, фронтальный фасад, дверь, окно, вывеска на кронштейне"></textarea>
          </div>
          <div class="field">
            <label for="avoid">Не изображать</label>
            <input id="avoid" name="avoid" type="text" placeholder="кружка, бокал, чашка" autocomplete="off">
          </div>
          <div class="field">
            <label class="check"><input id="force" type="checkbox"> Перерисовать, если файл уже есть</label>
          </div>
          <div class="actions">
            <button id="generate" class="primary" type="submit">Сгенерировать</button>
            <button id="generate-missing" type="button">Все отсутствующие</button>
          </div>
        </form>
      </section>

      <section class="panel">
        <h2>Набор</h2>
        <div class="actions">
          <button id="validate" type="button">Проверить SVG</button>
          <button id="preview" type="button">Собрать превью</button>
        </div>
      </section>

      <section class="panel">
        <h2>Лог</h2>
        <pre id="log" class="log">Готов к работе.</pre>
      </section>
    </aside>

    <main>
      <div id="grid" class="grid"></div>
      <section class="panel preview-panel">
        <h2>Превью набора</h2>
        <div id="preview-wrap" class="preview-wrap">Превью ещё не собрано.</div>
      </section>
    </main>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id)
  let state = null
  let busy = false

  const esc = (value) =>
    String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')

  function log(message) {
    $('log').textContent = message
  }

  function setBusy(value) {
    busy = value
    $('generate').disabled = value || !state?.keyConfigured
    $('generate-missing').disabled = value || !state?.keyConfigured
    $('validate').disabled = value
    $('preview').disabled = value
  }

  function showPreview(url) {
    $('preview-wrap').innerHTML = `<a href="${url}" target="_blank" rel="noreferrer"><img src="${url}" alt="Превью набора"></a>`
  }

  function renderPreview() {
    if (state?.previewExists && !$('preview-wrap').querySelector('img')) {
      showPreview('/preview.png')
    }
  }

  function iconMarkup(svg, size) {
    return `<span class="size"><span style="width:${size}px;height:${size}px;display:block">${svg.replace('<svg ', `<svg style="width:${size}px;height:${size}px" `)}</span><span>${size}</span></span>`
  }

  function card(icon) {
    const tags = icon.tags.map((tag) => `<span class="tag">${esc(tag)}</span>`).join('')
    const problems = icon.problems.length
      ? `<ul class="problems">${icon.problems.map((p) => `<li>${esc(p)}</li>`).join('')}</ul>`
      : ''
    const regenerateDisabled = state?.keyConfigured ? '' : 'disabled'
    const directionNote = icon.directionCount
      ? `Подходов использовано: ${icon.directionCount}. Последний: ${esc(icon.lastDirection)}`
      : 'Каждая генерация пробует новую композицию.'

    const visual = icon.svg
      ? `<div class="tokens">
           <div class="token">${icon.svg.replace('<svg ', '<svg ')}</div>
           <div class="token token--dark">${icon.svg.replace('<svg ', '<svg ')}</div>
           <div class="sizes">${iconMarkup(icon.svg, 24)}${iconMarkup(icon.svg, 32)}${iconMarkup(icon.svg, 48)}</div>
         </div>`
      : `<div class="empty-icon">${icon.exists ? 'SVG не прошёл проверку' : 'Файла пока нет'}</div>`

    return `<article class="icon-card" data-card="${esc(icon.id)}">
      <div class="icon-card__head">
        <div>
          <h3 class="icon-card__name">${esc(icon.title)}</h3>
          <div class="icon-card__id">${esc(icon.id)}</div>
        </div>
        <span class="status ${icon.valid ? 'status--ok' : 'status--bad'}">${icon.valid ? 'OK' : 'Проверить'}</span>
      </div>
      ${visual}
      ${tags ? `<div class="tags">${tags}</div>` : ''}
      ${problems}
      <details class="brief" data-brief-for="${esc(icon.id)}">
        <summary>Уточнение${icon.brief ? ' · задано' : ''}</summary>
        <div class="brief__body">
          <div class="field">
            <label>Что изобразить</label>
            <textarea data-brief="${esc(icon.id)}" rows="3" placeholder="Например: здание таверны, фронтальный фасад, дверь, окно, вывеска на кронштейне">${esc(icon.brief)}</textarea>
          </div>
          <div class="field">
            <label>Не изображать</label>
            <input data-avoid="${esc(icon.id)}" type="text" value="${esc(icon.avoid)}" placeholder="кружка, бокал, чашка" autocomplete="off">
          </div>
          <div class="brief__meta">${directionNote}</div>
          <div class="brief__row">
            <button class="small" type="button" data-save-brief="${esc(icon.id)}">Сохранить</button>
            ${icon.directionCount ? `<button class="small" type="button" data-reset="${esc(icon.id)}">Сбросить историю</button>` : ''}
          </div>
        </div>
      </details>
      <div class="actions-row">
        <button class="small" type="button" data-regen="${esc(icon.id)}" title="Новая композиция, а не повтор прошлой" ${regenerateDisabled}>Перегенерировать</button>
        ${icon.exists ? `<a class="download" href="/api/icon/${encodeURIComponent(icon.id)}.svg" target="_blank" rel="noreferrer">SVG</a>` : ''}
      </div>
    </article>`
  }

  function render() {
    if (!state) return
    const openBriefs = new Set(
      [...document.querySelectorAll('details.brief[open]')].map((node) => node.dataset.briefFor)
    )
    $('key-dot').className = `dot ${state.keyConfigured ? '' : 'dot--bad'}`
    $('key-text').textContent = state.keyConfigured
      ? `DeepSeek подключён · ${state.model ?? 'deepseek-reasoner'}`
      : 'Ключ не найден'
    $('banner').innerHTML = state.keyConfigured
      ? ''
      : `<div class="banner">DEEPSEEK_API_KEY не найден. Создай <code>tools/icon-forge/.env</code> по образцу <code>.env.example</code> и перезапусти сервер.</div>`
    $('grid').innerHTML = state.icons.map(card).join('')
    for (const node of document.querySelectorAll('details.brief')) {
      if (openBriefs.has(node.dataset.briefFor)) node.open = true
    }
    renderPreview()
    setBusy(busy)
  }

  async function load() {
    const response = await fetch('/api/state')
    state = await response.json()
    render()
  }

  async function generate(payload) {
    const response = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    const result = await response.json()
    if (!response.ok) throw new Error(result.error || 'Ошибка генерации')
    state = result.state
    render()
    log(result.output || (result.ok ? 'Готово.' : 'Не удалось сгенерировать.'))
    return result
  }

  async function postAction(path) {
    const response = await fetch(path, { method: 'POST' })
    const result = await response.json()
    if (!response.ok) throw new Error(result.error || 'Ошибка выполнения')
    return result
  }

  $('validate').addEventListener('click', async () => {
    if (busy) return
    setBusy(true)
    log('Проверяем SVG…')
    try {
      const result = await postAction('/api/validate')
      state = result.state
      render()
      log(result.output || (result.ok ? 'Проверка пройдена.' : 'Есть ошибки проверки.'))
    } catch (error) {
      log(String(error))
    } finally {
      setBusy(false)
    }
  })

  $('preview').addEventListener('click', async () => {
    if (busy) return
    setBusy(true)
    log('Собираем контактный лист… это займёт несколько секунд.')
    try {
      const result = await postAction('/api/preview')
      state = result.state
      render()
      if (result.previewUrl) showPreview(result.previewUrl)
      log(result.output || (result.ok ? 'Превью готово.' : 'Не удалось собрать превью.'))
    } catch (error) {
      log(String(error))
    } finally {
      setBusy(false)
    }
  })

  $('form').addEventListener('submit', async (event) => {
    event.preventDefault()
    if (busy) return
    setBusy(true)
    log('Генерируем…')
    try {
      await generate({
        id: $('id').value,
        title: $('title').value,
        tags: $('tags').value,
        brief: $('brief').value,
        avoid: $('avoid').value,
        force: $('force').checked
      })
      $('id').value = ''
      $('title').value = ''
      $('tags').value = ''
      $('brief').value = ''
      $('avoid').value = ''
      $('force').checked = false
    } catch (error) {
      log(String(error))
    } finally {
      setBusy(false)
    }
  })

  $('generate-missing').addEventListener('click', async () => {
    if (busy || !state) return
    const missing = state.icons.filter((icon) => !icon.exists || !icon.valid)
    if (missing.length === 0) {
      log('Нет иконок, требующих генерации.')
      return
    }
    setBusy(true)
    try {
      for (const icon of missing) {
        log(`Генерируем ${icon.id}…`)
        await generate({
          id: icon.id,
          title: icon.title,
          tags: icon.tags,
          brief: icon.brief,
          avoid: icon.avoid,
          force: true
        })
      }
      log('Все иконки обработаны.')
    } catch (error) {
      log(String(error))
    } finally {
      setBusy(false)
    }
  })

  function cardValues(article) {
    return {
      brief: article.querySelector('[data-brief]')?.value.trim() ?? '',
      avoid: article.querySelector('[data-avoid]')?.value.trim() ?? ''
    }
  }

  async function saveBrief(id, brief, avoid) {
    const response = await fetch('/api/brief', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, brief, avoid })
    })
    const result = await response.json()
    if (!response.ok) throw new Error(result.error || 'Не удалось сохранить уточнение')
    state = result.state
  }

  document.addEventListener('click', async (event) => {
    if (busy) return

    const saveButton = event.target.closest('[data-save-brief]')
    if (saveButton) {
      const article = saveButton.closest('.icon-card')
      const values = cardValues(article)
      try {
        await saveBrief(saveButton.dataset.saveBrief, values.brief, values.avoid)
        log(`Уточнение для ${saveButton.dataset.saveBrief} сохранено.`)
      } catch (error) {
        log(String(error))
      }
      return
    }

    const resetButton = event.target.closest('[data-reset]')
    if (resetButton) {
      const id = resetButton.dataset.reset
      try {
        const response = await fetch('/api/reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id })
        })
        const result = await response.json()
        if (!response.ok) throw new Error(result.error || 'Ошибка сброса')
        state = result.state
        render()
        log(`История подходов для ${id} сброшена.`)
      } catch (error) {
        log(String(error))
      }
      return
    }

    const button = event.target.closest('[data-regen]')
    if (!button) return
    const icon = state?.icons.find((item) => item.id === button.dataset.regen)
    if (!icon) return
    const values = cardValues(button.closest('.icon-card'))
    setBusy(true)
    log(`Генерируем ${icon.id}: новая композиция…`)
    try {
      await generate({
        id: icon.id,
        title: icon.title,
        tags: icon.tags,
        brief: values.brief,
        avoid: values.avoid,
        force: true,
        variant: true
      })
    } catch (error) {
      log(String(error))
    } finally {
      setBusy(false)
    }
  })

  document.addEventListener('change', (event) => {
    const field = event.target.closest('[data-brief], [data-avoid]')
    if (!field) return
    const article = field.closest('.icon-card')
    const id = article?.dataset.card
    if (!id) return
    const values = cardValues(article)
    void saveBrief(id, values.brief, values.avoid).catch(() => {})
  })

  $('refresh').addEventListener('click', () => void load())
  void load()
</script>
</body>
</html>
